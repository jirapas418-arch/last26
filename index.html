<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Matrix Pro Ultra</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --accent-purple: #c084fc;
            --accent-green: #4ade80;
            --accent-red: #f87171;
            --text: #f8fafc;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background: var(--bg-color); color: var(--text); padding: 12px; }
        h3 { font-size: 14px; text-transform: uppercase; letter-spacing: 0.05em; color: #94a3b8; margin-bottom: 8px; }
        .section { background: var(--card-bg); padding: 12px; border-radius: 12px; margin-bottom: 12px; border: 1px solid #334155; }
        
        /* Navigation & Button Rows */
        .flex-row { display: flex; gap: 6px; margin-bottom: 6px; }
        .pos-btn, .action-btn, .street-btn, .size-btn, .hit-btn {
            flex: 1; padding: 10px 4px; background: #334155; border: none; border-radius: 8px;
            color: #cbd5e1; font-weight: bold; font-size: 12px; cursor: pointer; transition: all 0.1s;
            text-align: center;
        }
        .pos-btn.active { background: var(--accent); color: #000; }
        .action-btn.active { background: var(--accent-purple); color: #000; }
        .street-btn.active { background: #e2e8f0; color: #000; }
        .size-btn.active { background: #f59e0b; color: #000; }
        .hit-btn.active { background: var(--accent-green); color: #000; }
        
        /* 13x13 Preflop Grid */
        .grid-container {
            display: grid; grid-template-columns: repeat(13, 1fr); gap: 2px;
            background: #000; padding: 4px; border-radius: 6px; margin-top: 8px;
        }
        .cell {
            background: #1e293b; color: #64748b; font-size: 7px; font-weight: bold;
            aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
            border-radius: 2px; text-transform: uppercase;
        }
        .cell.highlight { background: #0369a1; color: #fff; }
        .cell.highlight-purple { background: #7e22ce; color: #fff; }
        
        /* Postflop Layout */
        .grid-3col { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        .draw-btn {
            background: #334155; border: none; padding: 8px; border-radius: 6px;
            color: #fff; font-size: 11px; text-align: left; display: flex; flex-direction: column;
        }
        .draw-btn.active { background: #0284c7; box-shadow: 0 0 8px var(--accent); }
        .draw-btn small { color: #94a3b8; font-size: 9px; }
        
        /* Output Box Layout */
        .output-box { border-left: 4px solid var(--accent); background: #111827; padding: 10px; border-radius: 0 8px 8px 0; }
        .equity-txt { font-size: 24px; font-weight: 900; color: var(--accent); }
        .adv-txt { font-size: 13px; color: #cbd5e1; margin-top: 4px; line-height: 1.4; }
    </style>
</head>
<body>

    <div class="section">
        <h3>1. Preflop Positioning & Actions</h3>
        <div class="flex-row">
            <button class="pos-btn active" onclick="setPos('utg', this)">UTG</button>
            <button class="pos-btn" onclick="setPos('co', this)">CO</button>
            <button class="pos-btn" onclick="setPos('btn', this)">BTN</button>
            <button class="pos-btn" onclick="setPos('sb', this)">SB</button>
        </div>
        <div class="flex-row">
            <button class="action-btn active" onclick="setAction('open', this)">Open (RFI)</button>
            <button class="action-btn" onclick="setAction('call', this)">Cold Call</button>
            <button class="action-btn" onclick="setAction('3bet', this)">Cold 3B</button>
            <button class="action-btn" onclick="setAction('4bet', this)">Cold 4B</button>
        </div>
        <div class="grid-container" id="matrixGrid"></div>
    </div>

    <div class="section">
        <h3>2. Choose Street & Sizing</h3>
        <div class="flex-row">
            <button class="street-btn active" onclick="setStreet('flop', this)">Flop</button>
            <button class="street-btn" onclick="setStreet('turn', this)">Turn</button>
        </div>
        <div class="flex-row" style="margin-top:6px;">
            <button class="size-btn active" onclick="setSize(0.33, '33', this)">33%</button>
            <button class="size-btn" onclick="setSize(0.50, '50', this)">50%</button>
            <button class="size-btn" onclick="setSize(0.75, '75', this)">75%</button>
            <button class="size-btn" onclick="setSize(1.00, '100', this)">100%</button>
        </div>
    </div>

    <div class="section">
        <h3>3. Hand Grouping & Execution</h3>
        <div class="flex-row" style="margin-bottom:10px;">
            <button class="hit-btn active" onclick="setHit('before', this)">Before Hit (Draws)</button>
            <button class="hit-btn" onclick="setHit('after', this)">After Hit (Made Hand)</button>
        </div>
        
        <div id="drawsWrapper" class="grid-3col">
            <button class="draw-btn active" id="g-4" onclick="setGroup(4, 'g-4')"><span>Gutshot</span><small>4 Outs</small></button>
            <button class="draw-btn" id="g-6" onclick="setGroup(6, 'g-6')"><span>Two Over</span><small>6 Outs</small></button>
            <button class="draw-btn" id="g-8" onclick="setGroup(8, 'g-8')"><span>OESD</span><small>8 Outs</small></button>
            <button class="draw-btn" id="g-9" onclick="setGroup(9, 'g-9')"><span>Flush Draw</span><small>9 Outs</small></button>
            <button class="draw-btn" id="g-12" onclick="setGroup(12, 'g-12')"><span>Flush+Gut</span><small>12 Outs</small></button>
            <button class="draw-btn" id="g-15" onclick="setGroup(15, 'g-15')"><span>Combo Draw</span><small>15 Outs</small></button>
            <button class="draw-btn" id="g-made" onclick="setGroup(0, 'g-made')"><span>Made Hand</span><small>Value</small></button>
        </div>
    </div>

    <div class="section output-box">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3>Live Execution Output</h3>
            <div class="equity-txt" id="eqTxt">0.0%</div>
        </div>
        <div class="adv-txt" id="advTxt">Select your inputs to map execution.</div>
    </div>

    <script>
        // Core State Engine Variables
        let currentPos = 'utg';
        let currentAction = 'open';
        let street = 'flop';
        let betRatio = 0.33;
        let sizeId = '33';
        let hitStatus = 'before';
        let groupOuts = 4;
        let activeGroupId = 'g-4';

        const ranks = ['A','K','Q','J','T','9','8','7','6','5','4','3','2'];

        // Fully Expanded Multidimensional Strategy Matrix
        const ranges = {
            open: {
                utg: ["AA","KK","QQ","JJ","TT","99","88","77","AKs","AQs","AJs","ATs","A9s","KQs","KJs","KTs","QJs","QTs","JTs","T9s","AKo","AQo","AJo","ATo"],
                co: ["AA","KK","QQ","JJ","TT","99","88","77","66","55","AKs","AQs","AJs","ATs","A9s","A8s","A7s","A6s","KQs","KJs","KTs","K9s","QJs","QTs","Q9s","JTs","T9s","98s","AKo","AQo","AJo","ATo","KQo","KJo"],
                btn: ["AA","KK","QQ","JJ","TT","99","88","77","66","55","44","33","22","AKs","AQs","AJs","ATs","A9s","A8s","A7s","A6s","A5s","A4s","A3s","A2s","KQs","KJs","KTs","K9s","K8s","K7s","QJs","QTs","Q9s","JTs","J9s","T9s","T8s","98s","97s","87s","76s","65s","54s","AKo","AQo","AJo","ATo","A9o","A8o","KQo","KJo","KTo","QJo","QTo","JTo","T9o"],
                sb: ["AA","KK","QQ","JJ","TT","99","88","77","66","55","44","33","22","AKs","AQs","AJs","ATs","A9s","A8s","A7s","A6s","A5s","A4s","A3s","A2s","KQs","KJs","KTs","K9s","K8s","QJs","QTs","Q9s","JTs","J9s","T9s","T8s","98s","87s","76s","65s","AKo","AQo","AJo","ATo","A9o","A8o","A7o","KQo","KJo","KTo","QJo","QTo","JTo"]
            },
            call: {
                utg: ["JJ","TT","99","88","77","66","AQs","AJs","KQs","AKo"], // Tight defense baseline
                co: ["JJ","TT","99","88","77","66","55","AQs","AJs","ATs","KQs","KJs","QJs","JTs","AKo","AQo"],
                btn: ["TT","99","88","77","66","55","44","33","22","AJs","ATs","A9s","KQs","KJs","KTs","QJs","QTs","JTs","T9s","98s","87s","AQo","KQo","KJo"],
                sb: ["JJ","TT","99","88","77","66","AQs","AJs","ATs","KQs","KJs","QJs","JTs","AQo"]
            },
            3bet: {
                utg: ["AA","KK","QQ","JJ","TT","AKs","AQs","AJs","AKo","AQo"],
                co: ["AA","KK","QQ","JJ","TT","99","AKs","AQs","AJs","ATs","KQs","KJs","A5s","A4s","AKo","AQo","AJo"],
                btn: ["AA","KK","QQ","JJ","TT","99","88","AKs","AQs","AJs","ATs","A5s","A4s","A3s","KQs","KJs","KTs","QJs","JTs","T9s","AKo","AQo","AJo","KQo"],
                sb: ["AA","KK","QQ","JJ","TT","99","88","AKs","AQs","AJs","ATs","A5s","A4s","KQs","KJs","KTo","QJs","AKo","AQo","AJo"]
            },
            4bet: {
                utg: ["AA","KK","QQ","AKs","AKo"],
                co: ["AA","KK","QQ","JJ","AKs","AQs","A5s","AKo","AQo"],
                btn: ["AA","KK","QQ","JJ","TT","AKs","AQs","AJs","A5s","A4s","AKo","AQo"],
                sb: ["AA","KK","QQ","JJ","AKs","AQs","A5s","AKo","AQo"]
            }
        };

        function renderGrid() {
            const container = document.getElementById('matrixGrid');
            container.innerHTML = '';
            const activeRange = ranges[currentAction][currentPos] || [];

            for (let r = 0; r < 13; r++) {
                for (let c = 0; r < 13; c++) {
                    if (c >= 13) break; // Row boundary trap safety
                    let hand = "";
                    if (r === c) hand = ranks[r] + ranks[c];
                    else if (r < c) hand = ranks[r] + ranks[c] + 's';
                    else hand = ranks[c] + ranks[r] + 'o';

                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.innerText = hand;

                    if (activeRange.includes(hand)) {
                        if (currentAction === 'open') cell.classList.add('highlight');
                        else cell.classList.add('highlight-purple');
                    }
                    container.appendChild(cell);
                }
            }
        }

        function setPos(pos, btn) {
            currentPos = pos;
            document.querySelectorAll('.pos-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderGrid();
        }

        function setAction(act, btn) {
            currentAction = act;
            document.querySelectorAll('.action-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderGrid();
        }

        function setStreet(str, btn) {
            street = str;
            document.querySelectorAll('.street-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            engine();
        }

        function setSize(ratio, id, btn) {
            betRatio = ratio; sizeId = id;
            document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            engine();
        }

        function setHit(status, btn) {
            hitStatus = status;
            document.querySelectorAll('.hit-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            engine();
        }

        function setGroup(outs, id) {
            groupOuts = outs; activeGroupId = id;
            document.querySelectorAll('.draw-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            engine();
        }

        function engine() {
            const mult = (street === 'flop') ? 4 : 2;
            let equity = groupOuts * mult;
            if (groupOuts === 12 && street === 'turn') equity = 26.1; 
            if (groupOuts === 15 && street === 'turn') equity = 32.6;
            
            const potOdds = (betRatio / (1 + (2 * betRatio))) * 100;
            
            document.getElementById('eqTxt').innerText = (groupOuts === 0) ? "VALUE" : equity.toFixed(
